# ~/.config/kitty/quick-access-terminal.conf
# Config for the `kitten quick-access-terminal` (Quake-style dropdown).
# Only options documented for this kitten are valid directly; any *kitty*
# option must be set via `kitty_override`.

# --- Dropdown placement / behaviour ---
edge top
lines 30
margin_top 0
margin_left 0
margin_right 0

# Auto-hide when it loses focus (Quake-style)
hide_on_focus_loss yes

# Pre-spawn hidden (launched at login) so the first toggle is instant
start_as_hidden yes
