# ~/.config/kitty/theme.conf
# Monokai-ish on a dark grey background, with a few Solarized-esque
# accents (teal/cyan + blue) mixed into the classic Monokai palette.
# Included by kitty.conf. Swap this file to reskin everything.

# --- base ---   (deep warm grey)
foreground              #f8f8f2
background              #14150f
selection_foreground    #14150f
selection_background    #3e3d32

# --- cursor ---
cursor                  #a6e22e
cursor_text_color       #14150f

# --- url / links ---   (solarized-esque blue)
url_color               #268bd2

# --- window borders ---
active_border_color     #66d9ef
inactive_border_color   #3e3d32
bell_border_color       #e6db74

# --- tab bar ---
active_tab_foreground   #14150f
active_tab_background    #66d9ef
inactive_tab_foreground #a6a69c
inactive_tab_background #262620
tab_bar_background      #0e0f0a

# --- normal colors (0-7) ---
color0  #14150f
color1  #f92672
color2  #a6e22e
color3  #e6db74
color4  #268bd2
color5  #ae81ff
color6  #2aa198
color7  #f8f8f2

# --- bright colors (8-15) ---
color8  #75715e
color9  #fd5ff0
color10 #a6e22e
color11 #e6db74
color12 #66d9ef
color13 #ae81ff
color14 #66d9ef
color15 #f9f8f5
