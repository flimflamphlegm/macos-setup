# ~/.config/kitty/kitty.conf
# end-4 dotfiles inspired config (macOS)
# Reload live with: Cmd+Shift+, (or `kitten @ load-config`)

# =====================================================================
#  Fonts
# =====================================================================
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 14.0

# Ligatures on (turn off only under the cursor)
disable_ligatures cursor

# A touch more vertical room, like end-4
modify_font cell_height 2px

# =====================================================================
#  Cursor  —  the "fluid" glide effect
# =====================================================================
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0

# Fluid cursor trail (kitty >= 0.36). Lower decay = longer/smoother trail.
cursor_trail 3
cursor_trail_decay 0.10 0.40
cursor_trail_start_threshold 2

# =====================================================================
#  Window / layout
# =====================================================================
remember_window_size  no
initial_window_width  1100
initial_window_height 700

window_padding_width 12
window_margin_width 0
placement_strategy center

# Rounded, floaty look: transparency + blur (macOS supports blur)
background_opacity 0.7
background_blur 25
dynamic_background_opacity yes

hide_window_decorations titlebar-only
macos_titlebar_color background
macos_show_window_title_in none
confirm_os_window_close 0

# Inactive panes dim slightly
inactive_text_alpha 0.85
active_border_color none

# =====================================================================
#  Tab bar  —  end-4 style slanted powerline tabs
# =====================================================================
tab_bar_edge top
tab_bar_style slant
tab_bar_align center
tab_bar_min_tabs 1
tab_activity_symbol none
tab_title_template "{fmt.fg._1e1e2e}{fmt.bg.default} {index}  {title[:22]} "
active_tab_title_template "{fmt.fg._66d9ef}{fmt.bg.default} {index}  {title[:22]} "
tab_title_max_length 24
active_tab_font_style bold

# =====================================================================
#  Bell / misc
# =====================================================================
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled
copy_on_select yes
strip_trailing_spaces smart
scrollback_lines 20000

mouse_hide_wait 2.0
detect_urls yes
url_style curly

# macOS niceties
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_thicken_font 0.35

# =====================================================================
#  Keybinds (end-4-ish)
# =====================================================================
# Splits
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+w           close_window
# Navigate splits
map cmd+alt+left    neighboring_window left
map cmd+alt+right   neighboring_window right
map cmd+alt+up      neighboring_window up
map cmd+alt+down    neighboring_window down
# Tabs
map cmd+t           new_tab_with_cwd
map cmd+shift+right next_tab
map cmd+shift+left  previous_tab
# Font size
map cmd+equal       change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0
# Opacity on the fly
map cmd+shift+u     set_background_opacity +0.02
map cmd+shift+i     set_background_opacity -0.02
# Reload config
map cmd+shift+comma load_config_file

# Free ctrl+shift+esc so the OS-level (skhd) quick-access hotkey passes through
map ctrl+shift+esc no_op

# =====================================================================
#  Colors  (edit theme.conf to reskin)
# =====================================================================
include theme.conf
