# ~/.config/kitty/quick-access-terminal.conf
# Config for the `kitten quick-access-terminal` (Quake-style dropdown).
# Only options documented for this kitten are valid directly; any *kitty*
# option must be set via `kitty_override`.

# --- Dropdown placement / behaviour ---
edge top
lines 30
margin_top 0
margin_left 0
margin_right 0

# Make the dropdown look EXACTLY like a normal kitty window: load the full
# kitty.conf (theme, font, opacity, blur, colors, etc.). Bare kitty options
# are ignored by this kitten, so anything visual must come via kitty_conf /
# kitty_override.
kitty_conf kitty.conf

# Auto-hide when it loses focus (Quake-style)
# Keep the dropdown open even when focus moves to another window/panel.
# (Set to 'yes' for classic auto-hide. It's 'no' so the dropdown survives
# when Maccy's clipboard popup takes focus — Maccy pastes back into it.
# Close the dropdown manually with Ctrl+Shift+Esc.)
hide_on_focus_loss no

# Pre-spawn hidden (launched at login) so the first toggle is instant
start_as_hidden yes

# Draw the dropdown panel at the NORMAL macOS window level. This ensures
# popups like Maccy's clipboard window render ABOVE the dropdown instead of
# behind it. (Always-on-top across app activation isn't achievable with the
# quick-access kitten on macOS — the panel doesn't re-assert its level.)
kitty_override macos_ns_window_layer=NSScreenSaverWindowLevel
